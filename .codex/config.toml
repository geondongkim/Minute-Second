# Project-scoped Codex configuration for Minute_Second.
# Codex loads this file only when the project is trusted.

sandbox_mode = "workspace-write"
approval_policy = "on-request"
approvals_reviewer = "auto_review"

# Keep project instructions available even as this repository grows.
project_doc_max_bytes = 49152
project_doc_fallback_filenames = ["CLAUDE.md", "README.md"]
project_root_markers = [".git", "AGENTS.md", "pyproject.toml", "package.json"]

developer_instructions = """
Before coding in this repository, read AGENTS.md and follow its command, testing,
documentation, and safety guidance. Prefer repo-local patterns, keep changes scoped,
and report any skipped verification with the reason.
"""

[features]
multi_agent = true
shell_tool = true
shell_snapshot = true
codex_hooks = true

[sandbox_workspace_write]
network_access = false

[auto_review]
policy = """
When reviewing changes in this repository, prioritize regressions in the FastAPI job
pipeline, React upload/progress/result flows, Manifest V3 permissions/CSP, secret
handling, and missed verification. Treat generated outputs and local media as out of
scope unless they are explicitly part of the requested change.
"""
