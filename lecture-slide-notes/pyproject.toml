[project]
name = "lecture-slide-notes"
version = "0.1.0"
description = "Build slide PNGs, searchable PDFs, and NotebookLM-friendly Markdown from Vimeo, YouTube, or local lecture videos."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "google-genai>=0.1.0",
    "pillow>=10.0.0",
    "pymupdf>=1.24.0",
    "python-dotenv>=1.0.0",
    "reportlab>=4.0.0",
    "yt-dlp>=2025.1.15",
]

[project.optional-dependencies]
ocr = ["pytesseract>=0.3.13"]
mcp = ["mcp>=1.0.0"]
dev = ["pytest>=8.0.0", "ruff>=0.8.0"]

[project.scripts]
lecture-slide-notes = "lecture_slide_notes.cli:main"
lecture-slide-notes-mcp = "lecture_slide_notes.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lecture_slide_notes"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"
