[project]
name = "minute-second"
version = "0.2.0"
description = "FastAPI + React 기반 동영상 자동 회의록 서비스 (오디오 추출 → STT → LLM 요약)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "aiofiles>=24.1.0",
    "fastapi>=0.115.0",
    "faster-whisper>=1.0.0",
    "ffmpeg-python>=0.2.0",
    "google-genai>=0.1.0",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.12",
    "sse-starlette>=2.0.0",
    "torch==2.8.0+cpu",
    "torchaudio==2.8.0+cpu",
    "huggingface_hub[hf_xet]",
    "uvicorn[standard]>=0.32.0",
    "whisperx>=3.8.5"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv]
package = false
override-dependencies = [
    # pyannote-audio 4.x가 torchcodec을 무조건 요구하지만, Windows에서는 DLL 로드 실패.
    # Linux x86_64 / macOS에서만 설치되도록 제한.
    "torchcodec>=0.6.0,<0.8.0; (sys_platform == 'linux' and platform_machine == 'x86_64') or sys_platform == 'darwin'",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchaudio = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }
whisperx = { path = "./ref/whisperX" }
